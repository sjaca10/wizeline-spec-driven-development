schema: spec-driven

# Project context - injected into EVERY
# AI planning request automatically
context: |
  Plain web app. HTML5 + CSS3 + JS ES2022.
  No frameworks, no build tools.
  Files: index.html, style.css, app.js.
  No external libraries (no jQuery, lodash).
  Inputs validate before calculating.
  Results formatted to 2 decimal places.
  Mobile-responsive (min-width: 320px).
  Colors #1a1a2e (bg) #e94560 (accent).
  Forbidden: var, inline, styles, alert()

# Per-artifact rules
rules:
  specs:
    - Use Given/When/Then for all scenarios
  tasks:
    - Break into 15-60 min chunks max

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
