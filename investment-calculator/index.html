<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Investment Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1 class="calculator__title">Investment Calculator</h1>
    <p class="calculator__subtitle">
      Estimate the future value of a lump-sum investment with fixed annual compound interest.
    </p>

    <form id="calculator-form" class="calculator__form" novalidate>
      <div class="field">
        <label for="principal">Principal ($)</label>
        <input type="number" id="principal" name="principal" step="any" inputmode="decimal" autocomplete="off">
        <span class="field__error" id="principal-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" name="rate" step="any" inputmode="decimal" autocomplete="off">
        <span class="field__error" id="rate-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="years">Years</label>
        <input type="number" id="years" name="years" step="any" inputmode="decimal" autocomplete="off">
        <span class="field__error" id="years-error" role="alert"></span>
      </div>

      <button type="submit" class="calculator__submit">Calculate</button>
    </form>

    <section id="results" class="results" hidden aria-live="polite">
      <h2 class="results__title">Results</h2>
      <p class="results__row">Final Amount: <span id="result-amount" class="results__value"></span></p>
      <p class="results__row">Total Interest Earned: <span id="result-interest" class="results__value"></span></p>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
